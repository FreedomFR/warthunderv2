<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Combat naval — Simulation WWII</title>
<link rel="icon" href="data:,">
<style>
  :root { --amber: #e2a04e; --ink: #e8e2d6; --bg: #0b0f14d8; --line: #ffffff1a; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #c:active { cursor: grabbing; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hidden { display: none !important; }
  .panel { background: var(--bg); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 30px #0008; }
  .hud { background: #0b0f14b0; backdrop-filter: blur(5px); border-radius: 9px; border: 1px solid #ffffff12; }
  .title { display: flex; flex-direction: column; margin-bottom: 8px; }
  .title .big { font-size: 20px; font-weight: 700; letter-spacing: .3px; color: var(--amber); }
  .title .sub { font-size: 12px; opacity: .65; }
  .row { display: flex; gap: 6px; align-items: center; margin: 7px 0; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .hint { font-size: 11.5px; opacity: .6; margin-top: 8px; }
  .step { display: flex; gap: 7px; align-items: center; margin: 12px 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; opacity: .8; }
  .step b { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; background: var(--amber); color: #111; font-size: 11px; }
  .actions { position: sticky; bottom: -12px; margin: 8px -14px -12px; padding: 8px 14px 10px; background: #10151c; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
  .actions .hint { margin-top: 2px; }
  button, select, input { font: inherit; color: inherit; }
  select, input[type=number], input[type=text], .tname { background: #ffffff12; border: 1px solid #ffffff22; border-radius: 6px; padding: 5px 6px; outline: none; }
  select option { background: #151a21; color: var(--ink); }
  input[type=range] { accent-color: var(--amber); }
  .btn { background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 7px; padding: 7px 10px; cursor: pointer; transition: background .12s; }
  .btn:hover { background: #ffffff26; }
  a.btn { color: inherit; text-decoration: none; text-align: center; display: inline-block; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: #e2a04e33; border-color: #e2a04e88; }
  .btn.primary:hover { background: #e2a04e55; }
  .btn.go { background: #3aa65b44; border-color: #3aa65b99; font-weight: 700; }
  .btn.go:hover:not(:disabled) { background: #3aa65b77; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .btn.tiny { padding: 3px 7px; font-size: 12px; }
  .btn.on { background: #e2a04e55; border-color: var(--amber); }
  .ico { background: #ffffff12; border: 1px solid #ffffff22; border-radius: 5px; width: 24px; height: 24px; cursor: pointer; padding: 0; line-height: 1; }
  .ico:hover { background: #ffffff2a; }

  /* ---- setup ---- */
  #setup { position: fixed; left: 12px; top: 12px; width: 352px; max-height: calc(100vh - 24px); overflow: auto; transition: transform .25s; }
  #setup.collapsed { transform: translateX(-120%); }
  .team { border-left: 4px solid var(--tc); background: #ffffff0a; border-radius: 8px; padding: 7px 8px; margin: 8px 0; }
  .thead { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--tc); display: inline-block; flex: none; }
  .tname { flex: 1; font-weight: 700; min-width: 0; }
  .tcount { opacity: .6; font-size: 11.5px; }
  .entry { display: flex; align-items: center; gap: 6px; padding: 3px 2px; border-radius: 5px; }
  .entry:hover { background: #ffffff10; }
  .entry .cnt { width: 26px; font-weight: 700; color: var(--amber); }
  .entry .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry small { opacity: .6; }
  .add { display: flex; gap: 4px; margin-top: 6px; }
  .add select { min-width: 0; flex: 1; }
  .add select:first-child { max-width: 108px; }
  .card.info { background: #ffffff0c; border-radius: 8px; padding: 8px 9px; margin: 8px 0; min-height: 74px; }
  .ititle { color: var(--amber); font-weight: 700; margin-bottom: 3px; }
  .iline { font-size: 12px; opacity: .85; }
  .iline.strong { opacity: 1; font-weight: 600; }
  .iline.dim { opacity: .55; margin-top: 3px; font-size: 11.5px; }
  .slider { display: grid; grid-template-columns: 1fr 120px 52px; gap: 6px; align-items: center; margin: 5px 0; font-size: 12.5px; }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  .slider input[type=range] { width: 120px; }

  /* ---- HUD ---- */
  #topbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 5px 10px; }
  .clock { font: 600 16px ui-monospace, Consolas, monospace; min-width: 52px; }
  .sp { display: flex; gap: 3px; }
  .fps { opacity: .6; font-size: 11.5px; min-width: 44px; text-align: right; }
  #teamshud { position: fixed; top: 58px; right: 12px; display: flex; gap: 12px; padding: 8px 10px; max-width: 46vw; flex-wrap: wrap; }
  .tcol { min-width: 150px; }
  .thud-head { display: flex; align-items: center; gap: 6px; border-bottom: 2px solid var(--tc); padding-bottom: 2px; margin-bottom: 3px; }
  .thud-head .alive { margin-left: auto; opacity: .75; font-variant-numeric: tabular-nums; }
  .srow { display: grid; grid-template-columns: 24px 1fr 46px; gap: 5px; align-items: center; padding: 1px 3px; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .srow:hover { background: #ffffff14; }
  .srow.sel { background: #e2a04e30; }
  .srow.dead { opacity: .35; text-decoration: line-through; }
  .srow .ty { opacity: .6; font-size: 10.5px; font-weight: 700; }
  .srow .sn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hpbar { display: flex; flex-direction: column; gap: 1px; height: 7px; }
  .hpbar i { display: block; height: 3px; width: 100%; background: #4fb3d9; border-radius: 2px; transition: width .2s; }
  #cambar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; flex-wrap: nowrap; justify-content: center; max-width: 96vw; white-space: nowrap; }
  .cam { background: #ffffff12; border: 1px solid transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  .cam b { color: var(--amber); }
  .cam:hover { background: #ffffff24; }
  .cam.on { background: #e2a04e44; border-color: var(--amber); }
  #shipinfo, #reloads { box-sizing: border-box; }
  #shipinfo { position: fixed; bottom: 66px; right: 12px; max-height: calc(100vh - 330px); overflow: auto; width: 340px; padding: 8px 10px; }
  #shipinfo:empty { display: none; }
  #reloads { position: fixed; right: 12px; top: 190px; width: 340px; max-height: calc(100vh - 560px); overflow: hidden; display: flex; flex-direction: column; gap: 6px; padding: 7px 9px; pointer-events: none; }
  #reloads:empty { display: none; }
  #reloads .rl-title { font-size: 11px; opacity: .65; margin-bottom: 3px; letter-spacing: .3px; }
  #reloads .rl-row { display: flex; flex-wrap: wrap; gap: 6px; }
  #reloads .rl-cell { display: grid; justify-items: center; width: 44px; line-height: 1.05; --c: #e0b43a; }
  #reloads .rl-ring { position: relative; width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), #ffffff1f 0); display: grid; place-items: center; }
  #reloads .rl-ring::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #0b0f14e8; }
  #reloads .rl-ring b { position: relative; z-index: 1; font-size: 13px; }
  #reloads .rl-cell small { font-size: 10.5px; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #reloads .rl-cell i { font-style: normal; font-size: 9.5px; opacity: .6; }
  #reloads .st-ready { --c: #5ec26a; }
  #reloads .st-ready small { color: #5ec26a; font-weight: 700; }
  #reloads .st-dead, #reloads .st-ammo { --c: #d9534f; opacity: .6; }
  #reloads .st-jam { --c: #d9534f; }
  #reloads .st-jam small { color: #d9534f; }

  .si-head { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--tc); padding-bottom: 3px; }
  .si-head small { opacity: .6; }
  .si-meters { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; margin: 5px 0; font-size: 11px; opacity: .9; }
  .si-meters i { display: block; height: 6px; background: #ffffff22; border-radius: 3px; overflow: hidden; }
  .si-meters i b { display: block; height: 100%; }
  .si-meters .m1 b { background: #4fb3d9; }
  .si-meters .m2 b { background: #d9a35a; }
  .si-grid { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12px; }
  .si-grid span { opacity: .6; }
  .si-grid b { text-align: right; font-weight: 600; }
  .si-state { margin-top: 5px; color: #ff8a80; font-weight: 700; text-align: center; letter-spacing: 1px; }
  .si-more { display: block; margin: 4px auto 0; background: none; border: none; color: var(--amber); opacity: .75; font-size: 11.5px; cursor: pointer; padding: 1px 6px; }
  .si-more:hover { opacity: 1; }
  #setup:not(.collapsed) ~ #caption .back { display: none; }
  #planeinfo { position: fixed; bottom: 64px; right: 12px; width: 300px; padding: 8px 10px; }
  #dmgview { display: block; width: 100%; height: auto; margin: 4px 0 6px; border-radius: 6px; background: #0b0f1488; }
  #feed { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 3px; align-items: center; background: none; border: none; backdrop-filter: none; pointer-events: none; }
  #feed:empty { display: none; }
  .kline { background: #0b0f14c8; border-radius: 6px; padding: 3px 10px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; animation: fadein .3s; }
  .kline i { width: 9px; height: 9px; border-radius: 50%; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; padding: 1px 6px 1px 5px; border-radius: 10px; background: #0b0f14a0; font-size: 11.5px; white-space: nowrap; border: 1px solid transparent; will-change: transform; }
  .lab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
  .lab .ld { opacity: .6; font-size: 10.5px; }
  .lab .lbar { display: flex; flex-direction: column; gap: 1px; width: 34px; }
  .lab .lbar i { display: block; height: 2px; background: #4fb3d9; border-radius: 1px; }
  .lab.sel { border-color: var(--amber); background: #0b0f14d8; }
  .lab.far .ln, .lab.far .ld { display: none; }
  .lab.dead { opacity: .4; }
  .lab.plane { pointer-events: auto; cursor: pointer; padding: 0 5px; font-size: 13px; line-height: 1.25; color: var(--tc); background: #0b0f1488; }
  .lab.plane.hot { border-color: var(--tc); background: #0b0f14d0; }
  .lab.plane:hover { background: #ffffff30; }
  /* the first screen: the trailer plays (muted) while the engine, the models and the sounds load */
  #splash { position: fixed; inset: 0; z-index: 50; background: #06101a; color: #fff; overflow: hidden; transition: opacity .7s; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #splash .shade { position: absolute; inset: 0; background: linear-gradient(#0008 0, #0000 30%, #0000 55%, #000b 100%); }
  #splash .box { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); width: min(520px, 84vw); text-align: center; text-shadow: 0 2px 12px #000c; }
  #splash .t { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  #splash .s { font-size: 13px; opacity: .8; margin-bottom: 16px; }
  #splash .bar { height: 6px; border-radius: 3px; background: #ffffff33; overflow: hidden; }
  #splash .bar i { display: block; height: 100%; width: 3%; background: #4fc3f7; transition: width .25s; }
  #splash .l { font-size: 12.5px; opacity: .85; margin-top: 8px; min-height: 1.4em; }
  #splash button { margin-top: 10px; background: #0b1622cc; color: #fff; border: 1px solid #ffffff44; border-radius: 6px; padding: 6px 16px; font: inherit; cursor: pointer; }
  #loading { position: fixed; top: 38%; left: 50%; transform: translateX(-50%); width: min(420px, 80vw); padding: 16px 20px; border-radius: 10px; background: #0b1622ee; border: 1px solid #ffffff22; text-align: center; color: #fff; z-index: 40; }
  #loading .bar { height: 8px; margin: 12px 0 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #4fc3f7; transition: width .15s; }
  #loading span { font-size: 12px; opacity: .7; }
  #banner { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 14px #000c; pointer-events: none; animation: fadein .5s; color: #fff; }
  #results { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 520px; max-width: 92vw; max-height: 86vh; overflow: auto; }
  #results table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
  #results th { text-align: left; opacity: .6; font-weight: 600; padding: 3px 6px; }
  #results td { padding: 3px 6px; border-top: 1px solid #ffffff12; }
  #results tr.dead td { opacity: .55; }
  #score { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); min-width: 760px; max-width: 96vw; max-height: 84vh; overflow: auto; pointer-events: none; background: #0b0f14e6; }
  #score table { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #score th { text-align: left; opacity: .6; font-weight: 600; padding: 3px 7px; white-space: nowrap; }
  #score th.n, #score td.n { text-align: right; }
  #score td { padding: 2px 7px; border-top: 1px solid #ffffff10; white-space: nowrap; }
  #score tr.team td { background: #ffffff10; font-weight: 700; color: var(--tc); border-top: 2px solid var(--tc); }
  #score tr.dead td { opacity: .5; }
  #score tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
  #score .klog { margin-top: 6px; font-size: 12px; }
  #score .kh2 { opacity: .6; font-weight: 600; margin-bottom: 2px; }
  #score .kl .kt { opacity: .5; margin-right: 6px; font-variant-numeric: tabular-nums; }
  #score .kl .kh { opacity: .55; }
  .btn.tiny.on { background: var(--amber); color: #111; }
  .btn.tiny.tg.on { background: #e2a04e30; color: inherit; border-color: #e2a04eaa; }
  #hitlog { position: fixed; left: 12px; bottom: 100px; width: 360px; font-size: 12px; pointer-events: none; background: #0b0f14c0; border: 1px solid #ffffff18; border-radius: 8px; padding: 6px 9px; }
  #hitlog .hl-title { opacity: .6; font-weight: 600; margin-bottom: 3px; }
  #hitlog .hl-row { padding: 3px 0 3px 7px; border-left: 3px solid var(--hc); margin-top: 3px; line-height: 1.3; }
  #hitlog .hl-part, #hitlog .hl-dmg { opacity: .7; }
  #hitlog .hl-res { color: var(--hc); }
  #hitlog .hl-why { opacity: .6; font-size: 11px; }
  .hittag { position: absolute; left: 0; top: 0; pointer-events: none; text-align: center; white-space: nowrap; text-shadow: 0 1px 6px #000c; line-height: 1.15; }
  .hittag b { display: block; font-size: 15px; color: var(--hc); letter-spacing: .5px; }
  .hittag span { display: block; font-size: 11px; opacity: .9; }
  #help { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 640px; cursor: pointer; }
  .helpgrid { display: grid; grid-template-columns: 210px 1fr; gap: 6px 14px; margin-top: 6px; }
  .helpgrid b { color: var(--amber); font-weight: 600; }
  #settings { position: fixed; left: 12px; top: 12px; width: 340px; max-height: calc(100vh - 100px); overflow: auto; z-index: 5; }
  .pclose { float: right; width: 26px; height: 26px; border-radius: 7px; background: #ffffff14; border: 1px solid #ffffff2a; cursor: pointer; padding: 0; line-height: 1; }
  .pclose:hover { background: #ffffff2a; }
  details.fold { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  #balance .bgroup { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .6; }
  #balance .slider { grid-template-columns: 1fr 110px 58px; }
  #balance .slider input[type=range] { width: 110px; }
  #balance .bnum { width: 52px; padding: 3px 4px; text-align: right; }
  #balance .brow.changed span { color: var(--amber); }
  #balance .hint { margin-top: 4px; }
  details.fold summary { cursor: pointer; font-weight: 600; opacity: .8; padding: 3px 0; }
  .helpgrid i { grid-column: 1 / -1; font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; opacity: .5; margin-top: 6px; border-bottom: 1px solid var(--line); }
  /* ---- finding one's way: the map, the line under the picture, the first-battle tip ---- */
  /* ---- the performance test (ui/bench.js) ---- */
  #bench { position: fixed; left: 12px; top: 12px; width: min(420px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; z-index: 60; }
  #bench .bsz { display: block; width: 100%; text-align: left; margin: 8px 0 0; padding: 9px 11px; }
  #bench .bsz small { display: block; opacity: .7; margin-top: 2px; }
  #bench.running { width: min(300px, calc(100vw - 24px)); padding: 9px 12px; opacity: .92; }
  #bench .bl { margin: 5px 0 6px; font-weight: 600; }
  #bench .bs { opacity: .65; font-size: 11.5px; margin: 5px 0 7px; font-variant-numeric: tabular-nums; }
  #bench .bbar { height: 6px; background: #ffffff22; border-radius: 3px; overflow: hidden; }
  #bench .bbar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .25s; }
  #bench .bsum { font-size: 12px; margin: 8px 0; line-height: 1.5; }
  #bench .brep { width: 100%; box-sizing: border-box; font: 10.5px/1.35 ui-monospace, Consolas, monospace; background: #00000055; color: var(--ink); border: 1px solid #ffffff22; border-radius: 6px; padding: 6px; resize: vertical; white-space: pre; }
  #bench .bstat { color: var(--amber); font-size: 12px; flex: 0 0 auto; }
  #bench .row { margin: 6px 0; }
  #benchshield { position: fixed; inset: 0; z-index: 55; }
  body.benching #setup, body.benching #topbar, body.benching #cambar, body.benching #caption, body.benching #teamshud, body.benching #shipinfo, body.benching #reloads, body.benching #planeinfo, body.benching #feed, body.benching #hitlog, body.benching #minimap,
  body.benching #tip, body.benching #labels, body.benching #settings, body.benching #score, body.benching #banner, body.benching #mbar, body.benching #mmenu, body.benching #joy, body.benching #jbtns, body.benching #help { display: none !important; }
  #minimap { position: fixed; left: 12px; top: 12px; padding: 4px; line-height: 0; }
  #minimap.under { display: none; }
  #minimap.big { top: 58px; }
  #setup:not(.collapsed) ~ #cambar, #setup:not(.collapsed) ~ #caption { left: calc(50% + 186px); }
  #minimap canvas { border-radius: 6px; cursor: crosshair; display: block; }
  #caption { position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; align-items: baseline; white-space: nowrap; max-width: 92vw; overflow: hidden;
    padding: 3px 12px; border-radius: 14px; background: #0b0f1499; font-size: 14px; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #caption .cm { color: var(--amber); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  #caption b { font-weight: 700; }
  #caption .back { opacity: .5; font-size: 11.5px; margin-left: 6px; }
  #tip { position: fixed; bottom: 106px; left: 50%; transform: translateX(-50%); width: min(560px, 90vw); padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; border-color: #e2a04e66; animation: fadein .4s; }
  #tip b { color: var(--amber); grid-column: 1 / -1; }
  #tip span { font-size: 12.5px; opacity: .9; }
  #topbar .sep { width: 1px; align-self: stretch; background: #ffffff22; margin: 2px 2px; }
  .cgrp { position: relative; display: flex; gap: 4px; padding: 0 6px 0 0; margin-right: 2px; border-right: 1px solid #ffffff1c; }
  .cgrp::before { content: attr(data-g); position: absolute; top: -19px; left: 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; opacity: .6; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .subj { display: flex; gap: 4px; align-items: center; }
  .subj-n { min-width: 150px; max-width: 220px; text-align: center; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #err { position: fixed; inset: 0; display: none; padding: 40px; color: #f88; font: 16px system-ui; white-space: pre-wrap; background: #000; z-index: 10; }
  @media (max-width: 1320px) { #minimap { top: 58px; } .cam { padding: 5px 7px; } .subj-n { min-width: 110px; } #caption { bottom: 64px; } }
  @media (max-width: 1100px) { .cam b { display: none; } }

<canvas id="c"></canvas>
<div id="splash">
  <video id="splash-v" muted loop playsinline autoplay preload="auto" poster="docs/loading-poster.jpg"></video>
  <div class="shade"></div>
  <div class="box">
    <div class="t">Combat naval</div>
    <div class="s">Simulation de la Seconde Guerre mondiale</div>
    <div class="bar"><i id="splash-bar"></i></div>
    <div class="l" id="splash-l">Démarrage…</div>
    <button id="splash-skip" class="hidden">Entrer sans attendre</button>
  </div>
</div>
<script>
// the first screen (before any module is loaded): window.__splash.set(label, 0..1) moves the bar, hide() shows the game. ?splash=0 (and the tools' ?offscreen=1) skip it.
(function () {
  var el = document.getElementById('splash'), qs = location.search;
  if (/[?&](splash=0|offscreen=1|preview=|trailer|bench|start=1)/.test(qs)) { el.remove(); window.__splash = { set: function () {}, hide: function () {}, off: true }; return; }
  var bar = document.getElementById('splash-bar'), lab = document.getElementById('splash-l'), skip = document.getElementById('splash-skip'), v = document.getElementById('splash-v');
  // the clip: 1080p (13 MB) on a big screen with a good connection, 540p (2.5 MB) on a phone, a slow link, or when the browser asks to save data (the file is chosen here so that only one is fetched)
  try {
    var cn = navigator.connection;
    if (cn && cn.saveData) v.remove();
    else {
      var hd = Math.max(screen.width, screen.height) >= 1280 && !(cn && ((cn.effectiveType && cn.effectiveType !== '4g') || (cn.downlink && cn.downlink < 1))) && !/Mobi|Android/.test(navigator.userAgent);
      v.src = hd ? 'docs/loading-hd.mp4' : 'docs/loading.mp4';
      var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
    }
  } catch (e) { /* the poster stays */ }
  var gone = false;
  window.__splash = {
    set: function (label, frac) { if (gone) return; lab.textContent = label; bar.style.width = Math.max(3, Math.min(100, Math.round(frac * 100))) + '%'; },
    hide: function (now) { if (gone) return; gone = true; if (now) { el.remove(); return; } el.classList.add('out'); setTimeout(function () { el.remove(); }, 800); },
    skipped: false,
  };
  setTimeout(function () { if (!gone) skip.classList.remove('hidden'); }, 7000);
  skip.onclick = function () { window.__splash.skipped = true; window.__splash.hide(); };
})();
</script>
